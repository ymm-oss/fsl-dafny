# SPDX-License-Identifier: Apache-2.0
#
# Runs every positive run and negative control (run-all.sh) with pinned
# fslc, Dafny and Node. The real-model controls (RUN_AI=1) are not run here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FSLC_VERSION: v5.1.0
  DAFNY_VERSION: 4.11.0

jobs:
  run-all:
    runs-on: ubuntu-24.04  # the fslc release binary needs glibc 2.39
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23"
          cache: npm

      - name: Install fslc
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          gh release download "$FSLC_VERSION" -R ymm-oss/fsl -p fslc-linux-x64 -p fslc-linux-x64.sha256
          sha256sum -c fslc-linux-x64.sha256
          install -m 755 fslc-linux-x64 "$RUNNER_TEMP/bin/fslc"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install Dafny
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o dafny.zip "https://github.com/dafny-lang/dafny/releases/download/v$DAFNY_VERSION/dafny-$DAFNY_VERSION-x64-ubuntu-22.04.zip"
          unzip -q dafny.zip
          echo "$RUNNER_TEMP/dafny" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          fslc --version
          dafny --version
          node --version

      - run: npm ci

      - name: run-all.sh
        run: ./run-all.sh
